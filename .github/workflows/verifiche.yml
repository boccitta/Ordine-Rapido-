# Verifiche automatiche: partono a ogni modifica del ramo principale e a ogni proposta di modifica.
# Se una verifica fallisce, la modifica non è pronta.
name: Verifiche

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PLAYWRIGHT: "1.63.0"

jobs:
  prove:
    name: Prove della logica e controllo dei dati
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Non servono dipendenze: Node legge direttamente i file TypeScript della cartella src/.
      # Comprende: logica dell'app, versione allineata, librerie intatte, nessun dato reale, struttura del codice rispettata.
      - name: Prove automatiche
        run: npm test

  uso-reale:
    name: Tipi, compilazione, prova nel browser e come app desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Installa gli strumenti
        run: |
          npm ci
          node node_modules/electron/install.js
          npm install --no-save "playwright@$PLAYWRIGHT"
          npx playwright install --with-deps chromium
      - name: Controllo dei tipi
        run: npm run tipi
      # Compila src/ e prova il risultato; il processo principale dell'app desktop viene provato con un Electron simulato.
      - name: Compilazione e prove sul codice compilato
        run: |
          npm run compila
          npm run test:costruzione
      - name: Prova l'app aperta da file nel browser
        run: node test/e2e.js
      - name: Prova l'interfaccia in modalità desktop, con il ponte simulato
        run: node test/ponte.js
      - name: Prova la versione in un solo file
        run: |
          npm run costruisci
          node test/e2e.js dist/Ordine-Rapido.html
      - name: Prova l'app desktop
        run: xvfb-run -a node test/desktop.js
